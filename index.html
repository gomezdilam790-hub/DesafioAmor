<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Valeria</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PORTADA -->

    <section id="cover">

        <div class="paper">

            <div class="airplane-path">
                <span class="airplane">✈</span>
            </div>

            <div class="cover-content">

                <h1>Para Valeria</h1>

                <p class="subtitle">
                    Hay cosas que llevo guardando demasiado tiempo.
                </p>

                <button id="startBtn">
                    Abrir
                </button>

            </div>

        </div>

    </section>

    <!-- LIBRO -->

    <section id="book" class="hidden">

        <div class="page">

            <div class="left-page">

                <div class="page-decoration">
                    ✈
                </div>

                <div class="page-number">
                    01
                </div>

            </div>

            <div class="right-page">

                <div class="letter">

                    <p>
                        No sé si esta carta tiene un propósito.
                    </p>

                    <br>

                    <p>
                        Tal vez no busca cambiar nada.
                    </p>

                    <br>

                    <p>
                        Tal vez solo existe porque hay cosas que llevo guardando demasiado tiempo y ya pesan más de lo que debería.
                    </p>

                </div>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
